# Используйте этот файл если стандартный docker-compose.yml не работает
# Запуск: docker-compose -f docker-compose.host.yml up -d
#
# Этот файл использует host network mode, который обходит проблемы
# с Docker bridge networking на некоторых системах (Arch, Manjaro и др.)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auction-app
    network_mode: host
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=80
      - MONGODB_URI=mongodb://127.0.0.1:27017/auction_db?directConnection=true
      - REDIS_URI=redis://127.0.0.1:6379
      - DEFAULT_ROUND_DURATION_MS=${DEFAULT_ROUND_DURATION_MS:-300000}
      - ANTI_SNIPE_THRESHOLD_MS=${ANTI_SNIPE_THRESHOLD_MS:-30000}
      - ANTI_SNIPE_EXTENSION_MS=${ANTI_SNIPE_EXTENSION_MS:-60000}
      - MIN_BID_INCREMENT=${MIN_BID_INCREMENT:-10}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - BID_RATE_LIMIT_REQUESTS=${BID_RATE_LIMIT_REQUESTS:-0}
      - BID_RATE_LIMIT_WINDOW_SEC=${BID_RATE_LIMIT_WINDOW_SEC:-5}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: auction-mongo
    network_mode: host
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: auction-redis
    network_mode: host
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
      --timeout 0
      --port 6379
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  mongo-init:
    image: mongo:7
    container_name: auction-mongo-init
    network_mode: host
    depends_on:
      mongo:
        condition: service_healthy
    command: >
      mongosh --host 127.0.0.1:27017 --eval "
        try {
          const status = rs.status();
          print('Replica set already initialized:', status.set);
        } catch(e) {
          print('Initializing replica set...');
          rs.initiate({
            _id: 'rs0',
            members: [{_id: 0, host: '127.0.0.1:27017'}]
          });
          print('Replica set initialized');
        }
      "
    restart: "no"

volumes:
  mongo_data:
    name: auction-mongo-data
  mongo_config:
    name: auction-mongo-config
  redis_data:
    name: auction-redis-data

