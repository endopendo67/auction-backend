services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auction-app
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=80
      - MONGODB_URI=mongodb://mongo:27017/auction_db?replicaSet=rs0
      - REDIS_URI=redis://redis:6379
      - DEFAULT_ROUND_DURATION_MS=${DEFAULT_ROUND_DURATION_MS:-300000}
      - ANTI_SNIPE_THRESHOLD_MS=${ANTI_SNIPE_THRESHOLD_MS:-30000}
      - ANTI_SNIPE_EXTENSION_MS=${ANTI_SNIPE_EXTENSION_MS:-60000}
      - MIN_BID_INCREMENT=${MIN_BID_INCREMENT:-10}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - BID_RATE_LIMIT_REQUESTS=${BID_RATE_LIMIT_REQUESTS:-0}
      - BID_RATE_LIMIT_WINDOW_SEC=${BID_RATE_LIMIT_WINDOW_SEC:-5}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - auction-network

  mongo:
    image: mongo:7
    container_name: auction-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - auction-network

  redis:
    image: redis:7-alpine
    container_name: auction-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
      --timeout 0
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - auction-network

  mongo-init:
    image: mongo:7
    container_name: auction-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    command: >
      mongosh --host mongo:27017 --eval "
        try {
          const status = rs.status();
          print('Replica set already initialized:', status.set);
        } catch(e) {
          print('Initializing replica set...');
          rs.initiate({
            _id: 'rs0',
            members: [{_id: 0, host: 'mongo:27017'}]
          });
          print('Replica set initialized');
        }
      "
    restart: "no"
    networks:
      - auction-network

networks:
  auction-network:
    driver: bridge
    name: auction-network

volumes:
  mongo_data:
    name: auction-mongo-data
  mongo_config:
    name: auction-mongo-config
  redis_data:
    name: auction-redis-data
