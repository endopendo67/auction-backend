version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/auction_db?replicaSet=rs0
      - DEFAULT_ROUND_DURATION_MS=300000
      - ANTI_SNIPE_THRESHOLD_MS=30000
      - ANTI_SNIPE_EXTENSION_MS=60000
      - MIN_BID_INCREMENT=10
      - COOKIE_SECURE=false  # Для локального тестирования без HTTPS
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Инициализация replica set (выполняется один раз)
  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    command: >
      mongosh --host mongo:27017 --eval "
        try {
          rs.status();
        } catch(e) {
          rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]});
        }
      "
    restart: "no"

volumes:
  mongo_data:
